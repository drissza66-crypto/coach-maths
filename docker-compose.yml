# PostgreSQL pour tester comme en production (facultatif : sans Docker,
# l'API utilise PostgreSQL embarqué). Puis dans .env :
#   DATABASE_URL=postgres://mathsuivi:mathsuivi@localhost:5432/mathsuivi
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mathsuivi
      POSTGRES_PASSWORD: mathsuivi
      POSTGRES_DB: mathsuivi
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
